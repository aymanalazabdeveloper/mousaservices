<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحسابات</title><link rel="stylesheet" href="/css/style.css"></head>
<body style="background:#f3f6fa;min-height:100vh;padding:20px">
<main style="max-width:900px;margin:20px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #17324d12">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h1 style="font-size:24px;margin:0">إدارة حسابات الموظفين</h1><a href="/admin.html">العودة للوحة الإدارة</a></div>
<p style="color:#60738f;line-height:1.8">تُحفظ الحسابات في ملف <code>data/users.json</code>. كلمات المرور لا تُحفظ كنص واضح، بل تُخزّن بصيغة مشتقة ومملحة.</p>
<form id="createUserForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:24px 0;padding:18px;background:#f8fafc;border-radius:10px">
<label>اسم الموظف<input id="name" required maxlength="100" style="display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #dce4ed;border-radius:7px"></label>
<label>اسم المستخدم<input id="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" style="display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #dce4ed;border-radius:7px"></label>
<label>كلمة المرور<input id="password" type="password" required minlength="10" autocomplete="new-password" style="display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #dce4ed;border-radius:7px"></label>
<label>نوع الحساب<select id="role" style="display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #dce4ed;border-radius:7px"><option value="employee">موظف</option><option value="admin">مدير نظام</option></select></label>
<button class="submit" type="submit" style="align-self:end">إضافة الحساب</button><p id="message" style="grid-column:1/-1;margin:0" role="status"></p>
</form>
<h2 style="font-size:20px">الحسابات المسجلة</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;min-width:550px"><thead><tr><th style="text-align:right;padding:10px;border-bottom:1px solid #dce4ed">الاسم</th><th style="text-align:right;padding:10px;border-bottom:1px solid #dce4ed">اسم المستخدم</th><th style="text-align:right;padding:10px;border-bottom:1px solid #dce4ed">الصلاحية</th><th style="text-align:right;padding:10px;border-bottom:1px solid #dce4ed">الحالة</th><th style="text-align:right;padding:10px;border-bottom:1px solid #dce4ed">إجراء</th></tr></thead><tbody id="usersBody"><tr><td colspan="5" style="padding:12px">جارٍ التحميل...</td></tr></tbody></table></div>
</main>
<script>
let token=sessionStorage.getItem('mousaAdminToken')||'';let current=JSON.parse(sessionStorage.getItem('mousaAdminUser')||'null');
const msg=document.getElementById('message');
async function api(url,options={}){const headers={...(options.headers||{}),'x-admin-token':token};if(options.body)headers['Content-Type']='application/json';const r=await fetch(url,{...options,headers});const d=await r.json().catch(()=>({message:'استجابة غير مفهومة'}));if(!r.ok)throw new Error(d.message||'حدث خطأ');return d;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){const d=await api('/api/admin/users');document.getElementById('usersBody').innerHTML=d.users.map(u=>`<tr><td style="padding:10px;border-bottom:1px solid #edf1f5">${esc(u.name)}</td><td style="padding:10px;border-bottom:1px solid #edf1f5">${esc(u.username)}</td><td style="padding:10px;border-bottom:1px solid #edf1f5">${u.role==='admin'?'مدير نظام':'موظف'}</td><td style="padding:10px;border-bottom:1px solid #edf1f5">${u.active?'نشط':'موقوف'}</td><td style="padding:10px;border-bottom:1px solid #edf1f5">${u.id===current?.id?'الحساب الحالي':`<button type="button" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'إيقاف':'تفعيل'}</button>`}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد حسابات.</td></tr>';}
window.toggleUser=async(id,active)=>{try{await api('/api/admin/users/'+encodeURIComponent(id)+'/active',{method:'PATCH',body:JSON.stringify({active})});await load();}catch(e){alert(e.message);}};
document.getElementById('createUserForm').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='جارٍ الحفظ...';try{const d=await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,username:document.getElementById('username').value,password:document.getElementById('password').value,role:document.getElementById('role').value})});msg.textContent=d.message;msg.style.color='#16803f';e.target.reset();await load();}catch(err){msg.textContent=err.message;msg.style.color='#c62828';}});
if(!token||current?.role!=='admin'){document.querySelector('main').innerHTML='<h1>تسجيل الدخول مطلوب</h1><p>يجب تسجيل الدخول بحساب مدير النظام أولًا.</p><a href="/admin.html">الذهاب لتسجيل الدخول</a>';}else load().catch(e=>{document.querySelector('main').innerHTML='<h1>تعذر تحميل الحسابات</h1><p>'+esc(e.message)+'</p><a href="/admin.html">العودة لتسجيل الدخول</a>';});
</script></body></html>
